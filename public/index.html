<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Max Ads Bot | Dashboard</title>
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 (আইকনের জন্য) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- নিজস্ব CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- সাইডবার (মোবাইলে হাইড থাকে) -->
  <div class="sidebar" id="sidebar">
    <div class="logo">⚡ Max Ads</div>
    <nav>
      <div class="nav-item active" data-page="dashboard">
        <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
      </div>
      <div class="nav-item" data-page="adaccounts">
        <i class="fas fa-ad"></i> <span>Ad Accounts</span>
      </div>
      <div class="nav-item" data-page="pages">
        <i class="fas fa-file-alt"></i> <span>Pages</span>
      </div>
      <div class="nav-item" data-page="campaigns">
        <i class="fas fa-bullhorn"></i> <span>Campaigns</span>
      </div>
      <div class="nav-item" data-page="reports">
        <i class="fas fa-chart-line"></i> <span>Reports</span>
      </div>
      <div class="nav-item" data-page="settings">
        <i class="fas fa-cog"></i> <span>Settings</span>
      </div>
      <div class="nav-item" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
      </div>
    </nav>
  </div>

  <!-- মেইন কন্টেন্ট -->
  <div class="main">
    <!-- টপবার -->
    <div class="topbar">
      <button class="mobile-menu" id="mobileMenuBtn">
        <i class="fas fa-bars"></i>
      </button>
      <h2 id="pageTitle">Dashboard</h2>
      <div class="topbar-right">
        <button class="theme-toggle" id="themeToggle">
          <i class="fas fa-sun"></i>
        </button>
        <div class="user-info" id="userInfo">
          <img src="" alt="Profile" id="userAvatar">
          <span id="userName">Loading...</span>
        </div>
      </div>
    </div>

    <!-- ড্যাশবোর্ড কন্টেন্ট এরিয়া (কার্ড ও টেবিল) -->
    <div class="content" id="dashboardContent">
      <!-- জাভাস্ক্রিপ্ট দিয়ে ডাইনামিকভাবে পূরণ হবে -->
      <div class="loading">Loading...</div>
    </div>
  </div>

  <!-- নিজস্ব জাভাস্ক্রিপ্ট -->
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
